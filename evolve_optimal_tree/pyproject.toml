[project]
name = "pygosdt_v1"
version = "0.1.0"
description = "Pure-Python Generalized Optimal Sparse Decision Trees (GOSDT) with a numba-accelerated bitset engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
pygosdt = "pygosdt_v1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pygosdt_v1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]
