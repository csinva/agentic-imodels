[project]
name = "pygosdt_v1"
version = "0.1.0"
description = "Pure-Python Generalized Optimal Sparse Decision Trees (GOSDT) with a numba-accelerated bitset engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
pygosdt = "pygosdt_v1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baselines/pygosdt_v1"]

[tool.uv.workspace]
members = [
    "baselines/pystreed",
    "baselines/gosdt_guesses",
    "baselines/split/split",
]

[tool.uv.sources]
pystreed = { workspace = true }
gosdt = { workspace = true }
split = { workspace = true }

[dependency-groups]
baselines = [
    "pystreed",
    "gosdt",
    "split",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]
